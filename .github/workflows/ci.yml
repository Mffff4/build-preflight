name: ci
on: [push, pull_request]
jobs:
  bash32:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: bash version
        run: |
          /bin/bash --version | head -1
          if [ "${{ matrix.os }}" != "ubuntu-latest" ]; then
            /bin/bash -c 'case "$BASH_VERSION" in 3.2*) ;; *) echo "нужен bash 3.2, есть $BASH_VERSION"; exit 1;; esac'
          fi
      - name: tests
        run: /bin/bash tests/run.sh
